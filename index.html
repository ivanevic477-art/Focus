<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Birch — Daily Focus</title>
  <meta name="theme-color" content="#FBF8F1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <nav class="nav" id="nav">
      <button type="button" class="brand" data-a="theme-menu" aria-haspopup="menu" title="Change theme" aria-label="Birch — change theme"><img class="logo" src="logo.png" alt="" width="34" height="34"><span class="brand-name">Birch</span></button>
      <button data-a="nav" data-v="today"><span class="ico"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg></span><span>Today</span></button>
      <button data-a="nav" data-v="projects"><span class="ico"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h6l2 2h8v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/></svg></span><span>Projects</span></button>
      <button data-a="nav" data-v="focus"><span class="ico"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg></span><span>Focus</span></button>
      <button data-a="nav" data-v="calendar"><span class="ico"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></span><span>Calendar</span></button>
      <button data-a="nav" data-v="journal"><span class="ico"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h11a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H6zM6 4v16M10 9h5M10 13h5"/></svg></span><span>Journal</span></button>
      <button data-a="nav" data-v="stats"><span class="ico"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11M12 20V5M19 20v-7"/></svg></span><span>Stats</span></button>
      <div class="pill" id="pill" hidden></div>
      <div class="nav-extra" id="navExtra">
        <button type="button" class="nav-icon-btn" data-a="toggle-theme" id="themeBtn" aria-label="Toggle Twilight mode" title="Toggle Twilight mode"></button>
        <button type="button" class="nav-icon-btn" data-a="toggle-sound" id="soundBtn" aria-label="Toggle sound" title="Toggle sound"></button>
      </div>
    </nav>
    <main id="main"></main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
